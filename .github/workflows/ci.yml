name: Metadata and scaffold checks

on: [push, pull_request]

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pytest==9.1.1
      - run: python -m pytest
      - run: python scripts/generate_schemas.py --check
      - run: python scripts/demo.py --mock
      - run: python scripts/check_secrets.py
